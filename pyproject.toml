[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arch-viewer"
version = "2.0.0"
description = "MCP-native architecture viewer with AI-powered codebase analysis, AST parsing, architecture scoring, dependency graphs, and interactive dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AxumQuant", email = "hello@axumlabs.com" },
]
keywords = [
    "architecture", "visualization", "mcp", "code-analysis",
    "ast", "dependency-graph", "codebase", "devtools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-ai>=0.0.30",
    "watchdog>=4.0.0",
    "aiohttp>=3.10.0",
    "aiofiles>=24.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.37.0"]
graph = ["neo4j>=5.20", "mem0ai>=0.1.50", "qdrant-client>=1.9"]
all = [
    "anthropic>=0.37.0",
    "neo4j>=5.20",
    "mem0ai>=0.1.50",
    "qdrant-client>=1.9",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[project.urls]
Homepage = "https://github.com/axumquant/arch-viewer"
Repository = "https://github.com/axumquant/arch-viewer"
Issues = "https://github.com/axumquant/arch-viewer/issues"

[project.scripts]
arch-viewer = "arch_viewer.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
